# Every push and pull request: types, unit tests and the catalogue build.
name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run tipos
      - name: Unit tests
        run: npm test
      - name: Catalogue build
        run: npm run build-storybook
